name: Deploy UnboxedThinking CRM
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: unboxedthinking-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare public app assets (never include lead CSV)
        shell: bash
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/app.css assets/app.js assets/cloud.js _site/assets/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/app.css
          test -s _site/assets/app.js
          test -s _site/assets/cloud.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
